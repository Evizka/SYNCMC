name: Test and build MCSync

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcsync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          python -m compileall -q mcsync.py tests scripts
          python -m ruff check mcsync.py tests scripts --select E9,F
      - name: Require real Qt runtime
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt runtime OK')"
      - name: Unit, HTTP integration and GUI tests
        run: python -m pytest -q --junitxml=test-output/junit.xml
      - name: Source GUI startup
        run: python mcsync.py --smoke-test --data-dir test-output/source-smoke
      - name: Native build and frozen GUI startup
        run: python scripts/build.py
      - name: Upload native archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MCSync-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/MCSync-*.zip
            dist/MCSync-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tests-${{ runner.os }}-${{ runner.arch }}
          path: test-output/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  live-install:
    name: Real game / Java / loader installation (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Vanilla, Fabric, Quilt, Forge and NeoForge using Mojang Java
        run: python scripts/check_live_install.py --loaders vanilla fabric quilt forge neoforge
      - name: Upload live installation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-install-Windows
          path: test-output/live-install.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, live-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: MCSync-*
          merge-multiple: true
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.zip
            release-files/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
