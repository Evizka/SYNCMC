name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Gradle wrapper
        working-directory: mod-cenote-swamp
        run: |
          mkdir -p gradle/wrapper
          curl -fsL "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --no-daemon
          echo "Wrapper created"
          ls -la gradlew gradle/wrapper/

      - name: Build mod
        working-directory: mod-cenote-swamp
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon 2>&1 | tail -80
          echo "EXIT CODE: $?"

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mod-cenote-swamp/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30