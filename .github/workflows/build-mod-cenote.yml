name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download NeoForge MDK
        run: |
          curl -fsL "https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/archive/refs/heads/main.zip" -o /tmp/mdk.zip
          unzip -q /tmp/mdk.zip -d /tmp/mdk

      - name: Prepare project from MDK
        working-directory: mod-cenote-swamp
        run: |
          MDK=/tmp/mdk/MDK-1.21.1-ModDevGradle-main
          # Copy wrapper from MDK
          cp -r "$MDK/gradle" gradle/
          cp "$MDK/gradlew" gradlew
          cp "$MDK/gradlew.bat" gradlew.bat
          chmod +x gradlew
          echo "MDK files copied"
          ls -la gradlew gradle/wrapper/

      - name: Build mod
        working-directory: mod-cenote-swamp
        run: |
          ./gradlew build --stacktrace 2>&1
          EXIT=$?
          echo "--- Exit code: $EXIT ---"
          echo "--- Looking for jars ---"
          find . -name "*.jar" -not -path "./.gradle/*" -not -path "./gradle/*" 2>/dev/null
          exit $EXIT

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mod-cenote-swamp/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30