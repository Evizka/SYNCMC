name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download MDK and prepare wrapper
        working-directory: mod-cenote-swamp
        run: |
          curl -fsL "https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/archive/refs/heads/main.zip" -o /tmp/mdk.zip
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          MDK=/tmp/mdk/MDK-1.21.1-ModDevGradle-main
          cp -r "$MDK/gradle" .
          cp "$MDK/gradlew" "$MDK/gradlew.bat" .
          chmod +x gradlew
          echo "Wrapper ready"

      - name: Build mod
        working-directory: mod-cenote-swamp
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- Exit: $EXIT_CODE ---"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            tail -50 /tmp/build.log
            exit 1
          fi
          echo "=== BUILD SUCCESS ==="
          find build -name "*.jar" 2>/dev/null

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mod-cenote-swamp/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30