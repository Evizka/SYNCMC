name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get Gradle wrapper
        working-directory: mod-cenote-swamp
        run: |
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git /tmp/mdk
          cp -r /tmp/mdk/gradle .
          cp /tmp/mdk/gradlew /tmp/mdk/gradlew.bat .
          chmod +x gradlew

      - name: Build
        working-directory: mod-cenote-swamp
        run: ./gradlew build --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mod-cenote-swamp/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30