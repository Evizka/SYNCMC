name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build using official MDK
        run: |
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk
          cd mdk
          rm -rf src/main/java/com/example
          cp -r ../repo/mod-cenote-swamp/src/main/java/com src/main/java/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/cenoteswamp src/main/resources/data/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/minecraft src/main/resources/data/ 2>/dev/null || true
          mkdir -p src/main/resources/assets/cenoteswamp/textures/block
          # Write complete gradle.properties (MDK may not have mod_description)
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          parchment_minecraft_version=1.21.1
          parchment_mappings_version=2024.11.17
          minecraft_version=1.21.1
          minecraft_version_range=[1.21.1]
          neo_version=21.1.259
          loader_version_range=[1,)
          mod_id=cenoteswamp
          mod_name=Cenote Swamp
          mod_license=MIT
          mod_version=1.0.0
          mod_group_id=com.cenoteswamp
          mod_authors=Evizka
          mod_description=Deep cenote pits in a mystical swamp biome with massive ancient trees.
          PROPS
          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "=== building ==="
          chmod +x gradlew
          ./gradlew build --stacktrace
          echo "=== JARS ==="
          find . -name "*.jar" -not -path "./.gradle/*" -ls

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mdk/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30