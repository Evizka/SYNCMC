name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        working-directory: mod-cenote-swamp
        run: |
          # Download gradle binary to generate wrapper
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.10-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.10/bin/gradle wrapper --gradle-version 8.10
          rm -rf /tmp/gradle-8.10 /tmp/gradle.zip

      - uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Build
        working-directory: mod-cenote-swamp
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mod-cenote-swamp/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30