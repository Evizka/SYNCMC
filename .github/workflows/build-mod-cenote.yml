name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clone official NeoForge MDK
        run: git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk

      - name: Inject mod sources into MDK
        run: |
          cd mdk
          rm -rf src/main/java/com/example
          cp -r ../repo/mod-cenote-swamp/src/main/java/com src/main/java/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/cenoteswamp src/main/resources/data/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/minecraft src/main/resources/data/ 2>/dev/null || true
          mkdir -p src/main/resources/assets/cenoteswamp/textures/block
          sed -i 's/^mod_id=.*/mod_id=cenoteswamp/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=Cenote Swamp/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.cenoteswamp/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_description=.*/mod_description=Deep cenote pits in a mystical swamp biome./' gradle.properties

      - name: Build mod
        id: build
        working-directory: mdk
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Show build errors
        if: always()
        working-directory: mdk
        run: |
          echo "=== BUILD ERRORS ==="
          grep -E 'error:|cannot find symbol|package .* does not exist|incompatible types|method .* cannot|symbol:' /tmp/build.log 2>/dev/null | head -30 || echo "No errors found in log"
          echo "=== LAST 40 LINES ==="
          tail -40 /tmp/build.log 2>/dev/null || echo "No log"

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mdk/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30