name: Build Cenote Swamp Mod

on:
  push:
    paths:
      - 'mod-cenote-swamp/**'
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cenote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build using official MDK
        id: build
        run: |
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle.git mdk
          cd mdk
          rm -rf src/main/java/com/example
          cp -r ../repo/mod-cenote-swamp/src/main/java/com src/main/java/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/cenoteswamp src/main/resources/data/
          cp -r ../repo/mod-cenote-swamp/src/main/resources/data/minecraft src/main/resources/data/ 2>/dev/null || true
          mkdir -p src/main/resources/assets/cenoteswamp/textures/block
          sed -i 's/^mod_id=.*/mod_id=cenoteswamp/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=Cenote Swamp/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.cenoteswamp/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_description=.*/mod_description=Deep cenote pits in a mystical swamp biome./' gradle.properties
          sed -i 's/^mod_authors=.*/mod_authors=Evizka/' gradle.properties
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          set -e
          # Write errors to step summary (visible in GitHub UI)
          echo "## Build Exit Code: $EXIT" >> $GITHUB_STEP_SUMMARY
          if [ $EXIT -ne 0 ]; then
            echo '### Errors' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE 'error:|FAILED|cannot find|package.*does not exist|symbol:|What went wrong|BUILD FAILED' /tmp/build.log | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '### Last 40 lines' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -40 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### Jars found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "*.jar" -not -path "./.gradle/*" -ls >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cenoteswamp-mod
          path: mdk/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30