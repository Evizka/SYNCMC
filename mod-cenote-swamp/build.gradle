plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('mod_group_id') ?: 'com.cenoteswamp'

base {
    archivesName = project.findProperty('mod_id') ?: 'cenoteswamp'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.findProperty('neo_version') ?: '21.1.259'

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', (project.findProperty('mod_id') ?: 'cenoteswamp'), '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        cenoteswamp {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

tasks.withType(ProcessResources).configureEach {
    var props = [
        'minecraft_version': '1.21.1',
        'minecraft_version_range': '[1.21.1]',
        'neo_version': '21.1.259',
        'loader_version_range': '[1,)',
        'mod_id': 'cenoteswamp',
        'mod_name': 'Cenote Swamp',
        'mod_license': 'MIT',
        'mod_version': '1.0.0',
        'mod_authors': 'Evizka',
        'mod_description': 'Deep cenote pits in a mystical swamp biome with massive ancient trees.',
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}